name: check
on: [push, pull_request]
jobs:
  syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem plugins/outlook/scripts/*.ps1) {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -eq 0) { "OK    $($f.Name)" } else { $bad++; "ERROR $($f.Name)"; $errors | ForEach-Object { "      line $($_.Extent.StartLineNumber): $($_.Message)" } }
          }
          if ($bad) { exit 1 }
      - name: Compile Python scripts
        run: python -m py_compile plugins/outlook/scripts/*.py plugins/outlook/install.py install.py
      - name: Validate manifests and skill names
        shell: pwsh
        run: |
          Get-Content .claude-plugin/marketplace.json | ConvertFrom-Json | Out-Null
          Get-Content plugins/outlook/.claude-plugin/plugin.json | ConvertFrom-Json | Out-Null
          foreach ($d in Get-ChildItem plugins/outlook/skills -Directory) {
            $name = (Select-String -Path "$($d.FullName)/SKILL.md" -Pattern '^name: (\S+)' | Select-Object -First 1).Matches[0].Groups[1].Value
            if ($name -ne $d.Name) { throw "SKILL.md name '$name' does not match directory '$($d.Name)'" }
          }
          "manifests and skill names OK"
