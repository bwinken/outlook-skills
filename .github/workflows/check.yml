name: check
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile
        run: python -m compileall -q plugins/outlook/scripts plugins/outlook/install.py install.py
      - name: Script tests against the fake Outlook object model
        run: python plugins/outlook/tests/test_scripts.py
      - name: .msg parser against real samples
        run: python plugins/outlook/tests/test_msgfile.py
      - name: Build Claude Desktop zips
        run: python plugins/outlook/install.py --zip dist
      - name: Validate manifests and skill names
        shell: python
        run: |
          import json, re, pathlib
          json.load(open(".claude-plugin/marketplace.json", encoding="utf-8"))
          json.load(open("plugins/outlook/.claude-plugin/plugin.json", encoding="utf-8"))
          for d in pathlib.Path("plugins/outlook/skills").iterdir():
              if d.is_dir():
                  name = re.search(r"^name: (\S+)", (d / "SKILL.md").read_text(encoding="utf-8"), re.M).group(1)
                  assert name == d.name, f"{name} != {d.name}"
          print("manifests and skill names OK")
