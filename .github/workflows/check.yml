name: check
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Lint (ruff, pyflakes rules)
        run: pip install ruff && ruff check .
      - name: MCP scripts copy matches plugins/outlook/scripts
        run: python tools/sync_scripts.py --check
      - uses: actions/cache@v4
        with:
          path: plugins/outlook/tests/.samples
          key: msg-samples-v1
      - name: Script tests (fake Outlook), settings, .msg parser
        run: python -m unittest discover -s plugins/outlook/tests -v
      - name: MCP server tests (fake Outlook in-process, then over stdio)
        run: python -m unittest discover -s plugins/outlook-mcp/tests -v
      - name: Build Claude Desktop zips
        run: python plugins/outlook/install.py --zip dist
      - name: Validate manifests and skill names
        shell: python
        run: |
          import json, re, pathlib
          mp = json.load(open(".claude-plugin/marketplace.json", encoding="utf-8"))
          assert [p["name"] for p in mp["plugins"]] == ["outlook", "outlook-mcp"], mp["plugins"]
          for entry in mp["plugins"]:
              pj = json.load(open(pathlib.Path(entry["source"]) / ".claude-plugin" / "plugin.json", encoding="utf-8"))
              assert pj["name"] == entry["name"] and pj["version"] == entry["version"], (entry["name"], pj["version"], entry["version"])
          for d in pathlib.Path("plugins/outlook/skills").iterdir():
              if d.is_dir():
                  name = re.search(r"^name: (\S+)", (d / "SKILL.md").read_text(encoding="utf-8"), re.M).group(1)
                  assert name == d.name, f"{name} != {d.name}"
          mcp = json.load(open("plugins/outlook-mcp/.claude-plugin/plugin.json", encoding="utf-8"))
          assert "outlook" in mcp["mcpServers"] and not pathlib.Path("plugins/outlook-mcp/skills").exists()
          print("manifests and skill names OK")
