name: check
on: [push, pull_request]
jobs:
  syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem plugins/outlook/scripts/*.ps1) {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -eq 0) { "OK    $($f.Name)" } else { $bad++; "ERROR $($f.Name)"; $errors | ForEach-Object { "      line $($_.Extent.StartLineNumber): $($_.Message)" } }
          }
          if ($bad) { exit 1 }
      - name: Every .ps1 has a UTF-8 BOM (Windows PowerShell 5.1)
        shell: pwsh
        run: |
          $bad = Get-ChildItem plugins/outlook/scripts/*.ps1 | Where-Object { $b = [IO.File]::ReadAllBytes($_.FullName); -not ($b.Length -ge 3 -and $b[0] -eq 0xEF -and $b[1] -eq 0xBB -and $b[2] -eq 0xBF) }
          if ($bad) { $bad | ForEach-Object { "missing BOM: $($_.Name)" }; exit 1 } else { "BOM OK" }
      - name: Compile Python scripts
        run: python -m compileall -q plugins/outlook/scripts plugins/outlook/install.py install.py
      - name: Build Claude Desktop zips
        run: python plugins/outlook/install.py --zip dist
      - name: Validate manifests and skill names
        shell: pwsh
        run: |
          Get-Content .claude-plugin/marketplace.json | ConvertFrom-Json | Out-Null
          Get-Content plugins/outlook/.claude-plugin/plugin.json | ConvertFrom-Json | Out-Null
          foreach ($d in Get-ChildItem plugins/outlook/skills -Directory) {
            $name = (Select-String -Path "$($d.FullName)/SKILL.md" -Pattern '^name: (\S+)' | Select-Object -First 1).Matches[0].Groups[1].Value
            if ($name -ne $d.Name) { throw "SKILL.md name '$name' does not match directory '$($d.Name)'" }
          }
          "manifests and skill names OK"
